---
- name: Install and configure k8s
  hosts: all
  become: true

  vars:
    k8s_version: v1.34
    k8s_key_dir: /etc/apt/keyrings
    k8s_key_file: "{{ k8s_key_dir }}/k8s-release.key"
    k8s_keyring: "{{ k8s_key_dir }}/k8s-apt-keyring.gpg"
    k8s_repo: >-
      deb [signed-by={{ k8s_keyring }}]
      https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/
      /

  tasks:
    - name: Create keyrings dir
      ansible.builtin.file:
        path: "{{ k8s_key_dir }}"
        state: directory
        mode: "0755"

    - name: Download k8s key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key"
        dest: "{{ k8s_key_file }}"
        mode: "0644"

    - name: Install key
      ansible.builtin.command:
        cmd: gpg --dearmor -o {{ k8s_keyring }} "{{ k8s_key_file }}"
        creates: "{{ k8s_keyring }}"

    - name: Add k8s repo
      ansible.builtin.apt_repository:
        repo: "{{ k8s_repo }}"
        filename: k8s
        state: present
        update_cache: true

    - name: Install k8s packages
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        update_cache: true
        state: present
