# kubeadm init実行後に実行可能
---
- name: Install and configure kubeadm
  hosts: k8s_master
  become: true

  vars:
    kubeadm_config_dir: /root/.kube
    kubeadm_configure: "{{ k8s_config_dir }}"
    cni_url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
    dns_configure: /etc/kubernetes/config_map/coredns.yaml

  tasks:
    - name: Init kubeadm
      ansible.builtin.command:
        cmd: kubeadm init --config=/etc/kubernetes/config_map/kubeadm-config.yaml
        creates: /etc/kubernetes/admin.conf

    - name: Check admin.conf
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Show admin_conf
      ansible.builtin.debug:
        var: admin_conf

    - name: Create .kube
      ansible.builtin.file:
        path: "{{ kubeadm_config_dir }}"
        state: directory
        mode: "0700"

    - name: Copy admin.conf
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeadm_config_dir }}/config"
        remote_src: true
        mode: "0600"
      when: admin_conf.stat.exists

    - name: Create CNI
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ cni_url }}"
      changed_when: false

    - name: Settings DNS
      ansible.builtin.command:
        cmd: kubectl apply -f "{{ dns_configure }}"
      changed_when: false
