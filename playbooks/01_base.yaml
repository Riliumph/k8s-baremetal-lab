---
- name: Configure Linux
  hosts: all
  become: true

  tasks:
    - name: Disable swap
      ansible.builtin.command: swapoff -a
      changed_when: false
    # - name: deploy hosts
    #   copy:
    #     dest: /etc/hosts
    #     content: |
    #       127.0.0.1 localhost
    #       172.20.0.10 control-plane
    #       172.20.0.11 worker1
    #       172.20.0.12 worker2
    - name: Load br_netfilter
      community.general.modprobe:
        name: br_netfilter
        state: present
    - name: Enable ip_forward
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true
    - name: Enable bridge-nf-call-iptables
      ansible.posix.sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: "1"
        state: present
        reload: true
