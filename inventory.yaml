all:
  vars:
    ansible_python_interpreter: /usr/bin/python3

  children:
    k8s_master:
      hosts:
        control_plane:
          ansible_host: 172.20.0.10
          ansible_port: 22
          ansible_user: root

    k8s_workers:
      hosts:
        worker1:
          ansible_host: 172.20.0.11
          ansible_port: 22
          ansible_user: root

        worker2:
          ansible_host: 172.20.0.12
          ansible_port: 22
          ansible_user: root

    k8s_cluster:
      children:
        k8s_master:
        k8s_workers:
